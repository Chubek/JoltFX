name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure CMake
      run: cmake --preset default
      
    - name: Build
      run: cmake --build build
      
    - name: Run Tests
      run: ctest --test-dir build --output-on-failure
